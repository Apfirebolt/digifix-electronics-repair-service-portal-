{% extends 'partials/base.html' %}

{% block title %}
    Digifix - Confirm Delete Address
{% endblock %}

{% block content %}
<div class="min-h-[calc(100vh-160px)] bg-slate-50/50 flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-md w-full">
        
        <form method="post" class="bg-white rounded-2xl border border-slate-200/80 p-6 sm:p-8 shadow-sm text-center">
            {% csrf_token %}

            <div class="h-14 w-14 rounded-full bg-danger/10 text-danger flex items-center justify-center mx-auto mb-5">
                <svg class="h-7 w-7" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                </svg>
            </div>

            <h2 class="text-xl font-bold tracking-tight text-brand-dark">
                Delete Address?
            </h2>
            <p class="text-xs text-slate-500 mt-1">
                Are you sure you want to remove this saved address from your profile?
            </p>

            <div class="my-5 p-4 rounded-xl bg-slate-50 border border-slate-200/70 text-left">
                <div class="flex items-start gap-2.5">
                    <svg class="h-4 w-4 text-primary mt-0.5 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" />
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" />
                    </svg>
                    <div>
                        <span class="block text-[11px] font-bold uppercase tracking-wider text-slate-400 mb-0.5">Address</span>
                        <p class="text-xs text-slate-700 font-medium leading-relaxed">
                            {{ object.address }}
                        </p>
                    </div>
                </div>
            </div>

            <div class="flex items-center gap-3 pt-2">
                <button type="submit"
                        class="flex-1 inline-flex items-center justify-center px-4 py-2.5 rounded-lg text-sm font-semibold text-white bg-danger hover:opacity-90 shadow-sm transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-danger">
                    Yes, Delete
                </button>

                <a href="javascript:history.back()"
                   class="flex-1 inline-flex items-center justify-center px-4 py-2.5 rounded-lg text-sm font-medium text-slate-600 bg-slate-100 hover:bg-slate-200 hover:text-slate-900 transition-colors focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-slate-300">
                    Cancel
                </a>
            </div>
        </form>

    </div>
</div>
{% endblock %}
